<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gazu — profile</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#ecebe9] text-[#1a1a1a] font-sans antialiased selection:bg-[#1a1a1a] selection:text-[#fafafa]">
  <div class="w-full overflow-x-hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header class="w-full px-8 md:px-12 py-8 border-b border-[#1a1a1a]/10">
      <nav class="flex justify-between items-center">
        <a href="index.html" class="text-3xl font-medium tracking-[0.2em] uppercase">gazu</a>
        <div class="text-xs md:text-sm uppercase tracking-widest font-medium">my profile</div>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-8 py-12">
      <div class="w-full max-w-md">
        <!-- Profile Content -->
        <div id="profile-content" class="space-y-6">
          <div class="text-center mb-8">
            <h1 class="text-2xl font-medium uppercase tracking-wider mb-2">my account</h1>
            <p class="text-sm text-neutral-600" id="user-email"></p>
          </div>

          <!-- Update Information Form -->
          <form id="update-information-form" class="space-y-4">
            <div>
              <label for="profile-name" class="block text-xs uppercase tracking-widest mb-2 font-normal">your name</label>
              <input
                type="text"
                id="profile-name"
                required
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="your name"
              >
            </div>

            <div>
              <label for="current-password" class="block text-xs uppercase tracking-widest mb-2 font-normal">current password</label>
              <input
                type="password"
                id="current-password"
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="current password"
              >
            </div>

            <div>
              <label for="new-password" class="block text-xs uppercase tracking-widest mb-2 font-normal">new password</label>
              <input
                type="password"
                id="new-password"
                minlength="6"
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="new password"
              >
            </div>

            <div>
              <label for="confirm-new-password" class="block text-xs uppercase tracking-widest mb-2 font-normal">confirm new password</label>
              <input
                type="password"
                id="confirm-new-password"
                minlength="6"
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="confirm new password"
              >
            </div>

            <div id="profile-error" class="text-red-600 text-sm hidden"></div>
            <div id="profile-success" class="text-green-600 text-sm hidden"></div>

            <button
              type="submit"
              class="w-full bg-[#181818] text-[#f1f1f1] uppercase tracking-wider py-3 rounded-[2.5px] font-medium transition-transform hover:scale-[1.01] duration-300">
              update information
            </button>
          </form>

          <!-- Logout Button -->
          <button
            id="logout-btn"
            class="w-full bg-[#DB2907] text-white uppercase tracking-wider py-3 rounded-[2.5px] font-medium transition-transform hover:scale-[1.01] duration-300"
          >
            log out
          </button>

          <div class="text-center text-sm pt-4">
            <a href="shop.html?category=all" class="font-medium underline underline-offset-2 hover:opacity-70">
              back to shop
            </a>
          </div>
        </div>

        <!-- Not Logged In -->
        <div id="not-logged-in" class="space-y-6 hidden text-center">
          <p class="text-neutral-600 mb-4">You are not logged in</p>
          <a href="login.html" class="inline-block bg-[#0a0a0a] text-[#f1f1f1] uppercase tracking-wider px-6 py-3 rounded-[2px] font-medium transition-transform hover:scale-[1.01] duration-300">
            sign in
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="profile.js"></script>
</body>

</html>
