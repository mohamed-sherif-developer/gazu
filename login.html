<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gazu — login</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#ecebe9] text-[#1a1a1a] font-sans antialiased">
  <div class="w-full overflow-x-hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header class="w-full px-8 md:px-12 py-8 border-b border-[#1a1a1a]/10">
      <nav class="flex justify-between items-center">
        <a href="index.html" class="text-3xl font-medium tracking-[0.2em]">gazu</a>
        <div class="text-xs md:text-sm uppercase tracking-widest">login / sign up</div>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-8 py-12">
      <div class="w-full max-w-md">
        <!-- Login Form -->
        <div id="login-form" class="space-y-6">
          <div class="text-center mb-8">
            <h1 class="text-2xl font-medium uppercase tracking-wider mb-2">welcome back</h1>
            <p class="text-sm text-neutral-600">sign in to your account</p>
          </div>

          <form id="signin-form" class="space-y-4">
            <div>
              <label for="login-email" class="block text-xs uppercase tracking-widest mb-2">email</label>
              <input
                type="email"
                id="login-email"
                required
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="your@email.com"
              >
            </div>

            <div>
              <label for="login-password" class="block text-xs uppercase tracking-widest mb-2">password</label>
              <input
                type="password"
                id="login-password"
                required
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="••••••••"
              >
            </div>

            <div id="login-error" class="text-red-600 text-sm hidden"></div>

            <button
              type="submit"
              class="w-full bg-[#0a0a0a] text-[#f1f1f1] uppercase tracking-wider py-3 rounded-[2px] font-medium transition-transform hover:scale-[1.01] duration-300"
            >
              sign in
            </button>
          </form>

          <div class="text-center text-sm">
            <span class="text-neutral-600">don't have an account? </span>
            <button
              id="switch-to-signup"
              class="font-medium underline underline-offset-2 cursor-pointer hover:opacity-70"
            >
              sign up
            </button>
          </div>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form" class="space-y-6 hidden">
          <div class="text-center mb-8">
            <h1 class="text-2xl font-medium uppercase tracking-wider mb-2">create account</h1>
            <p class="text-sm text-neutral-600">join gazu today</p>
          </div>

          <form id="signup-form-element" class="space-y-4">
            <div>
              <label for="signup-name" class="block text-xs uppercase tracking-widest mb-2">full name</label>
              <input
                type="text"
                id="signup-name"
                required
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="your name"
              >
            </div>

            <div>
              <label for="signup-email" class="block text-xs uppercase tracking-widest mb-2">email</label>
              <input
                type="email"
                id="signup-email"
                required
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="your@email.com"
              >
            </div>

            <div>
              <label for="signup-password" class="block text-xs uppercase tracking-widest mb-2">password</label>
              <input
                type="password"
                id="signup-password"
                required
                minlength="6"
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="••••••••"
              >
              <p class="text-xs text-neutral-500 mt-1">minimum 6 characters</p>
            </div>

            <div>
              <label for="signup-confirm-password" class="block text-xs uppercase tracking-widest mb-2">confirm password</label>
              <input
                type="password"
                id="signup-confirm-password"
                required
                class="w-full px-4 py-3 border border-[#1a1a1a]/15 rounded-[2px] bg-white focus:outline-none focus:border-[#1a1a1a]/35 text-sm"
                placeholder="••••••••"
              >
            </div>

            <div id="signup-error" class="text-red-600 text-sm hidden"></div>

            <button
              type="submit"
              class="w-full bg-[#0a0a0a] text-[#f1f1f1] uppercase tracking-wider py-3 rounded-[2px] font-medium transition-transform hover:scale-[1.01] duration-300"
            >
              create account
            </button>
          </form>

          <div class="text-center text-sm">
            <span class="text-neutral-600">already have an account? </span>
            <button
              id="switch-to-signin"
              class="font-medium underline underline-offset-2 cursor-pointer hover:opacity-70"
            >
              sign in
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
</body>

</html>
